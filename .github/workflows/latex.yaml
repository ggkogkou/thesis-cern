name: Build LaTeX

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare TeX Live
        run: |
          docker build -t thesis-texlive - <<'EOF'
          FROM texlive/texlive:latest

          RUN apt-get update \
              && apt-get install -y --no-install-recommends inkscape fontconfig \
              && cp "$(kpsewhich -var-value=TEXMFSYSVAR)/fonts/conf/texlive-fontconfig.conf" /etc/fonts/conf.d/09-texlive.conf \
              && fc-cache -f \
              && rm -rf /var/lib/apt/lists/*
          EOF

      - name: Compile LaTeX
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/work" \
            -w /work \
            thesis-texlive \
            latexmk -xelatex -shell-escape \
              -file-line-error \
              -halt-on-error \
              -interaction=nonstopmode \
              thesis.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v7
        with:
          name: thesis
          path: thesis.pdf
          archive: false
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: thesis.pdf
